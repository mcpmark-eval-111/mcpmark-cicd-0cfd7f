name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run ESLint
        id: cq_eslint
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports
          echo "Running ESLint via npm run lint..."
          if npm run lint > reports/eslint.txt 2>&1; then
            echo "eslint_status=success" >> "$GITHUB_OUTPUT"
            echo "ESLint passed."
          else
            echo "eslint_status=failure" >> "$GITHUB_OUTPUT"
            echo "ESLint reported issues (continuing)."
          fi
          tail -n 200 reports/eslint.txt || true

      - name: Run Prettier check
        id: cq_prettier
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports
          echo "Running Prettier --check..."
          if npx --no-install prettier --check . > reports/prettier.txt 2>&1; then
            echo "prettier_status=success" >> "$GITHUB_OUTPUT"
            echo "Prettier formatting OK."
          elif npx prettier --check . > reports/prettier.txt 2>&1; then
            echo "prettier_status=success" >> "$GITHUB_OUTPUT"
            echo "Prettier formatting OK."
          else
            echo "prettier_status=failure" >> "$GITHUB_OUTPUT"
            echo "Prettier reported formatting issues (continuing)."
          fi
          tail -n 200 reports/prettier.txt || true

      - name: Upload code quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: reports/
          if-no-files-found: ignore

      - name: Post code quality PR comment
        if: always() && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8'); } catch (_e) { return '_no output captured_'; }
            };
            const eslintReport = readSafe('reports/eslint.txt').slice(0, 4000);
            const prettierReport = readSafe('reports/prettier.txt').slice(0, 4000);
            const eslintStatus = '${{ steps.cq_eslint.outputs.eslint_status }}' || 'unknown';
            const prettierStatus = '${{ steps.cq_prettier.outputs.prettier_status }}' || 'unknown';
            const cqBody = [
              '## 📊 Code Quality Report',
              '',
              'Automated code quality checks for this pull request.',
              '',
              `- **ESLint**: \`${eslintStatus}\``,
              `- **Prettier**: \`${prettierStatus}\``,
              '',
              '<details><summary>ESLint output</summary>',
              '',
              '```text',
              eslintReport,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Prettier output</summary>',
              '',
              '```text',
              prettierReport,
              '```',
              '',
              '</details>',
              '',
              `_Workflow run: ${context.runId} • Commit: ${context.sha.slice(0, 7)}_`
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: cqBody
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run test suite with coverage
        id: ts_run
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p coverage reports
          echo "Running npm test with coverage..."
          if npm test -- --coverage --coverageReporters=text --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=json-summary > reports/tests.txt 2>&1; then
            echo "tests_status=success" >> "$GITHUB_OUTPUT"
          elif npm test > reports/tests.txt 2>&1; then
            echo "tests_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "tests_status=failure" >> "$GITHUB_OUTPUT"
          fi
          tail -n 300 reports/tests.txt || true

      - name: Generate coverage summary
        if: always()
        run: |
          mkdir -p coverage
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage summary file present."
          else
            echo '{"total":{"lines":{"pct":0},"statements":{"pct":0},"functions":{"pct":0},"branches":{"pct":0}}}' > coverage/coverage-summary.json
          fi
          ls -la coverage/ || true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage/
            reports/tests.txt
          if-no-files-found: ignore

      - name: Post test coverage PR comment
        if: always() && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8'); } catch (_e) { return null; }
            };
            const testReport = (readSafe('reports/tests.txt') || '_no output captured_').slice(0, 4000);
            let coverageLine = 'Coverage data not available.';
            const summaryRaw = readSafe('coverage/coverage-summary.json');
            if (summaryRaw) {
              try {
                const parsedSummary = JSON.parse(summaryRaw);
                const totals = parsedSummary.total || {};
                const fmt = (m) => (m && typeof m.pct === 'number') ? `${m.pct.toFixed(2)}%` : 'n/a';
                coverageLine =
                  `Lines: ${fmt(totals.lines)} | ` +
                  `Statements: ${fmt(totals.statements)} | ` +
                  `Functions: ${fmt(totals.functions)} | ` +
                  `Branches: ${fmt(totals.branches)}`;
              } catch (_e) {
                coverageLine = 'Could not parse coverage summary.';
              }
            }
            const tsStatus = '${{ steps.ts_run.outputs.tests_status }}' || 'unknown';
            const tsBody = [
              '## 🧪 Test Coverage Report',
              '',
              'Automated test execution for this pull request.',
              '',
              `- **Test status**: \`${tsStatus}\``,
              `- **Coverage**: ${coverageLine}`,
              '',
              '<details><summary>Test runner output</summary>',
              '',
              '```text',
              testReport,
              '```',
              '',
              '</details>',
              '',
              '_Coverage artifacts have been uploaded to this workflow run._'
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: tsBody
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install || true
          else
            npm install || true
          fi

      - name: Dependency vulnerability check (npm audit)
        id: ss_audit
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports
          echo "Running npm audit..."
          npm audit --json > reports/audit.json 2>/dev/null || true
          npm audit > reports/audit.txt 2>&1 || true
          if [ -s reports/audit.json ]; then
            VULN_TOTAL=$(node -e "try { const a = require('./reports/audit.json'); const t = a.metadata && a.metadata.vulnerabilities ? a.metadata.vulnerabilities : {}; const sum = Object.values(t).reduce((s,v)=>s+(typeof v==='number'?v:0),0); console.log(sum); } catch(_e) { console.log('0'); }")
          else
            VULN_TOTAL=0
          fi
          echo "vuln_total=${VULN_TOTAL}" >> "$GITHUB_OUTPUT"
          echo "Total vulnerabilities reported: ${VULN_TOTAL}"

      - name: Secret scan in PR changes
        id: ss_secrets
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then BASE_REF="main"; fi
          git fetch --no-tags --depth=50 origin "$BASE_REF" || true
          DIFF_FILE=reports/pr-diff.patch
          git diff "origin/${BASE_REF}...HEAD" > "$DIFF_FILE" 2>/dev/null || git diff > "$DIFF_FILE" || true
          PATTERNS='(AKIA[0-9A-Z]{16})|(aws_secret_access_key)|(api[_-]?key\s*[:=])|(password\s*[:=]\s*["\x27][^"\x27]+)|(secret\s*[:=]\s*["\x27][^"\x27]+)|(BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY)|(ghp_[A-Za-z0-9]{20,})|(xox[baprs]-[A-Za-z0-9-]+)'
          if grep -E -i -n "$PATTERNS" "$DIFF_FILE" > reports/secrets.txt 2>/dev/null; then
            echo "secrets_found=true" >> "$GITHUB_OUTPUT"
            echo "Potential secrets detected in PR diff."
          else
            echo "secrets_found=false" >> "$GITHUB_OUTPUT"
            echo "No obvious secrets detected in PR diff." > reports/secrets.txt
          fi
          head -n 100 reports/secrets.txt || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: ignore

      - name: Post security scan PR comment
        if: always() && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8'); } catch (_e) { return '_no output captured_'; }
            };
            const auditReport = readSafe('reports/audit.txt').slice(0, 3500);
            const secretsReport = readSafe('reports/secrets.txt').slice(0, 2000);
            const vulnTotal = '${{ steps.ss_audit.outputs.vuln_total }}' || '0';
            const secretsFound = '${{ steps.ss_secrets.outputs.secrets_found }}' || 'false';
            const secBody = [
              '## 🔒 Security Scan Report',
              '',
              'Automated security analysis for this pull request.',
              '',
              '### Dependencies',
              `- **Total Vulnerabilities** found by \`npm audit\`: \`${vulnTotal}\``,
              '',
              '<details><summary>npm audit output</summary>',
              '',
              '```text',
              auditReport,
              '```',
              '',
              '</details>',
              '',
              '### Secret scanning',
              `- **Secrets detected in PR changes**: \`${secretsFound}\``,
              '',
              '<details><summary>Secret scan output</summary>',
              '',
              '```text',
              secretsReport,
              '```',
              '',
              '</details>',
              '',
              '_Security scan artifacts have been uploaded to this workflow run._'
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: secBody
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build application
        id: bv_build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports build-output
          echo "Attempting to build the application..."
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            if npm run build > reports/build.txt 2>&1; then
              echo "build_status=success" >> "$GITHUB_OUTPUT"
              echo "Build succeeded."
            else
              echo "build_status=failure" >> "$GITHUB_OUTPUT"
              echo "Build script failed (continuing)."
            fi
          else
            echo "No build script defined in package.json - treating as no-op." | tee reports/build.txt
            echo "build_status=skipped" >> "$GITHUB_OUTPUT"
          fi
          tail -n 200 reports/build.txt || true

      - name: Validate endpoints
        id: bv_endpoints
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports
          : > reports/endpoints.txt

          PORT="${PORT:-3000}"
          export PORT
          SERVER_PID=""

          start_app() {
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.start ? 0 : 1)"; then
              echo "Starting application via npm start on port ${PORT}..." | tee -a reports/endpoints.txt
              nohup npm start > reports/server.log 2>&1 &
              SERVER_PID=$!
              echo "server_pid=${SERVER_PID}" >> "$GITHUB_OUTPUT"
              for i in $(seq 1 20); do
                if curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/" 2>/dev/null; then
                  echo "Server is up after ${i} attempts." | tee -a reports/endpoints.txt
                  return 0
                fi
                sleep 1
              done
              echo "Server did not become ready in time." | tee -a reports/endpoints.txt
              return 1
            else
              echo "No start script defined - skipping endpoint validation." | tee -a reports/endpoints.txt
              return 2
            fi
          }

          start_app || true

          ENDPOINTS=("/" "/health" "/api" "/api/health" "/api/status")
          PASS=0
          FAIL=0
          for ep in "${ENDPOINTS[@]}"; do
            URL="http://127.0.0.1:${PORT}${ep}"
            if curl -fsS -o /dev/null -m 5 "$URL" 2>/dev/null; then
              echo "OK   ${URL}" | tee -a reports/endpoints.txt
              PASS=$((PASS+1))
            else
              echo "MISS ${URL}" | tee -a reports/endpoints.txt
              FAIL=$((FAIL+1))
            fi
          done
          echo "endpoints_pass=${PASS}" >> "$GITHUB_OUTPUT"
          echo "endpoints_fail=${FAIL}" >> "$GITHUB_OUTPUT"

          if [ -n "${SERVER_PID}" ]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi

      - name: Create deployment preview artifacts
        if: always()
        run: |
          set -o pipefail
          mkdir -p deployment-preview
          [ -d src ] && cp -r src deployment-preview/ || true
          [ -f package.json ] && cp package.json deployment-preview/ || true
          [ -f package-lock.json ] && cp package-lock.json deployment-preview/ || true
          [ -f README.md ] && cp README.md deployment-preview/ || true
          {
            echo "# Deployment Preview"
            echo
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- PR: #${{ github.event.pull_request.number }}"
          } > deployment-preview/PREVIEW.md
          ls -la deployment-preview/

      - name: Upload deployment preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: |
            deployment-preview/
            reports/
          if-no-files-found: ignore

      - name: Post build validation PR comment
        if: always() && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8'); } catch (_e) { return '_no output captured_'; }
            };
            const buildReport = readSafe('reports/build.txt').slice(0, 3500);
            const endpointReport = readSafe('reports/endpoints.txt').slice(0, 2500);
            const buildStatus = '${{ steps.bv_build.outputs.build_status }}' || 'unknown';
            const endpointsPass = '${{ steps.bv_endpoints.outputs.endpoints_pass }}' || '0';
            const endpointsFail = '${{ steps.bv_endpoints.outputs.endpoints_fail }}' || '0';
            const bvBody = [
              '## 🚀 Build Validation',
              '',
              'Automated build, endpoint, and deployment-preview checks for this pull request.',
              '',
              `- **Build status**: \`${buildStatus}\``,
              `- **Endpoints reachable**: \`${endpointsPass}\``,
              `- **Endpoints unreachable**: \`${endpointsFail}\``,
              '',
              '<details><summary>Build output</summary>',
              '',
              '```text',
              buildReport,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Endpoint validation output</summary>',
              '',
              '```text',
              endpointReport,
              '```',
              '',
              '</details>',
              '',
              '_Deployment preview artifacts have been uploaded to this workflow run._'
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: bvBody
            });
